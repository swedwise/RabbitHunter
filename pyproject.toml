[project]
name = "rabbithunter"
version = "1.0.0"
description = "A command-line tool for interacting with RabbitMQ queues."
authors = [
    { name="Henrik Blidh", email="henrik.blidh@swedwise.se" }
]
readme = "README.md"
dependencies = [
    "click>=8.0",
    "pika>=1.3"
]
requires-python = ">=3.8"

[project.scripts]
rabbit-hunter = "rabbithunter.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
